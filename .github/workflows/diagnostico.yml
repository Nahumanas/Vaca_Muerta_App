name: Diagnostico descarga (temporal)
on:
  push:
    branches: [diagnostico-descarga]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar espejos
        run: |
          for q in "produccion-de-petroleo-y-gas-por-pozo" "energia-produccion-petroleo-gas-por-pozo" "energia_produccion-petroleo-gas-por-pozo"; do
            echo "--- datos.gob.ar package_show $q"
            curl -sS --max-time 40 "https://datos.gob.ar/api/3/action/package_show?id=$q" | python3 -c "import sys,json; d=json.load(sys.stdin); [print('RES', r.get('name'), r.get('url')) for r in d['result']['resources']] if d.get('success') else print('RES no existe')" || echo "RES FALLO"
          done
          echo "--- busqueda"
          curl -sS --max-time 40 "https://datos.gob.ar/api/3/action/package_search?q=fractura%20pozos&rows=5" | python3 -c "import sys,json; d=json.load(sys.stdin); [print('PKG', p['name'], [r.get('url') for r in p['resources']][:4]) for p in d['result']['results']]" || echo "PKG FALLO"
          curl -sS --max-time 40 "https://datos.gob.ar/api/3/action/package_search?q=produccion%20petroleo%20gas%20pozo&rows=5" | python3 -c "import sys,json; d=json.load(sys.stdin); [print('PKG', p['name'], [r.get('url') for r in p['resources']][:6]) for p in d['result']['results']]" || echo "PKG FALLO"
          echo "--- reintento portal energia con 120s"
          curl -sS -o /dev/null -w "RES https v4 -> %{http_code} %{time_total}s\n" --max-time 120 "https://datos.energia.gob.ar/api/3/action/package_show?id=produccion-de-petroleo-y-gas-por-pozo" || echo "RES portal FALLO"
