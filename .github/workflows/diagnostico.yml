name: Diagnostico descarga (temporal)
on:
  push:
    branches: [diagnostico-descarga]
jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - run: cat /etc/os-release | head -2
      - run: getent ahosts datos.energia.gob.ar || true; dig +short A datos.energia.gob.ar || true; dig +short AAAA datos.energia.gob.ar || true
      - run: curl -4 -sS -o /dev/null -w "http v4: %{http_code} %{time_total}s -> %{redirect_url}\n" --max-time 40 "http://datos.energia.gob.ar/api/3/action/package_show?id=produccion-de-petroleo-y-gas-por-pozo" || true
      - run: curl -4 -sS -o /dev/null -w "https v4: %{http_code} %{time_total}s\n" --max-time 40 "https://datos.energia.gob.ar/api/3/action/package_show?id=produccion-de-petroleo-y-gas-por-pozo" || true
      - run: curl -6 -sS -o /dev/null -w "https v6: %{http_code} %{time_total}s\n" --max-time 20 "https://datos.energia.gob.ar/api/3/action/package_show?id=produccion-de-petroleo-y-gas-por-pozo" || true
      - run: curl -sS -o /dev/null -w "www.energia.gob.ar https: %{http_code} %{time_total}s\n" --max-time 40 "https://www.energia.gob.ar/" || true
      - run: curl -sS -o /dev/null -w "argentina.gob.ar https: %{http_code} %{time_total}s\n" --max-time 40 "https://www.argentina.gob.ar/" || true
      - run: curl -sS --max-time 20 https://ipinfo.io/json || true
